
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Reserva de Canchas</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f3;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }
    .container {
      max-width: 500px;
      background: white;
      margin: 20px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px #ccc;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input, select, button {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #27ae60;
      color: white;
      font-weight: bold;
      margin-top: 15px;
    }
    .hidden {
      display: none;
    }
    .comprobante {
      background: #ecf0f1;
      padding: 10px;
      margin-top: 20px;
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>Sistema de Reserva de Canchas</h1>

<div class="container" id="loginSection">
  <h2>Ingreso de Usuario</h2>
  <label for="correo">Correo electrónico:</label>
  <input type="email" id="correo" required>

  <label for="password">Contraseña:</label>
  <input type="password" id="password" required>

  <button onclick="login()">Ingresar</button>
</div>

<div class="container hidden" id="reservaSection">
  <h2>Reservar Cancha</h2>
  <label for="nombre">Nombre completo:</label>
  <input type="text" id="nombre">

  <label for="cancha">Tipo de cancha:</label>
  <select id="cancha">
    <option value="Fútbol">Fútbol</option>
    <option value="Tenis">Tenis</option>
    <option value="Basketball">Basketball</option>
  </select>

  <label for="fecha">Fecha:</label>
  <input type="date" id="fecha">

  <label for="hora">Hora:</label>
  <input type="time" id="hora">

  <button onclick="procesarPago()">Reservar y Pagar</button>

  <div id="comprobante" class="comprobante hidden">
    <h3>¡Reserva Exitosa!</h3>
    <p><strong>Nombre:</strong> <span id="r_nombre"></span></p>
    <p><strong>Cancha:</strong> <span id="r_cancha"></span></p>
    <p><strong>Fecha:</strong> <span id="r_fecha"></span></p>
    <p><strong>Hora:</strong> <span id="r_hora"></span></p>
    <p><strong>Código QR:</strong> <code>#QR-987654</code></p>
  </div>
</div>

<script>
  function login() {
    const correo = document.getElementById('correo').value;
    const password = document.getElementById('password').value;

    if (correo && password) {
      alert('Ingreso exitoso');
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('reservaSection').classList.remove('hidden');
    } else {
      alert('Por favor completa todos los campos');
    }
  }

  function procesarPago() {
    const nombre = document.getElementById('nombre').value;
    const cancha = document.getElementById('cancha').value;
    const fecha = document.getElementById('fecha').value;
    const hora = document.getElementById('hora').value;

    if (nombre && cancha && fecha && hora) {
      document.getElementById('r_nombre').innerText = nombre;
      document.getElementById('r_cancha').innerText = cancha;
      document.getElementById('r_fecha').innerText = fecha;
      document.getElementById('r_hora').innerText = hora;
      document.getElementById('comprobante').classList.remove('hidden');
    } else {
      alert('Por favor completa todos los datos de la reserva');
    }
  }
</script>

</body>
</html>
